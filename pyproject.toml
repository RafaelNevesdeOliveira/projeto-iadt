[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iadt-womens-health-ml"
version = "0.1.0"
description = "Clinical decision-support study for breast cancer risk classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2.0",
  "matplotlib>=3.9,<4.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "seaborn>=0.13,<1.0",
  "shap>=0.46,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0"]
demo = ["streamlit>=1.38,<2.0"]

[project.scripts]
iadt-ml = "iadt_ml.presentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=iadt_ml", "--cov-report=term-missing", "--cov-fail-under=90"]

[tool.coverage.run]
branch = true
source = ["iadt_ml"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
